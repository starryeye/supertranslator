[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supertranslator"
version = "0.8.0"
description = "Translate public webpages and PDFs into reviewed offline Korean artifacts."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "httpcore>=1.0,<1.1",
    "beautifulsoup4",
    "lxml",
    "tinycss2",
    "langdetect",
    "playwright",
    "pdfplumber>=0.11,<0.12",
    "pypdf>=6,<7",
    "reportlab>=4,<5",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-httpx",
    "fonttools>=4,<5",
]

[project.scripts]
supertranslator = "supertranslator.cli:console_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supertranslator = [
    "font_assets/*.ttf",
    "font_assets/OFL.txt",
    "font_assets/NotoSans-OFL.txt",
    "font_assets/PROVENANCE.json",
    "web_assets/preformatted-flow.css",
]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: opt-in network compatibility tests for changing upstream pages",
]
